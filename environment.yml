name: llm-bias-analysis
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10

  # Core data processing
  - pandas>=2.0
  - numpy>=1.24
  - pyarrow>=12.0

  # Machine learning (Steps 2, 4)
  - scikit-learn>=1.3
  - shap>=0.44

  # Statistical analysis (Step 4)
  - scipy>=1.11

  # Visualization (Step 5)
  - matplotlib>=3.8
  - seaborn>=0.13

  # Utilities
  - tqdm>=4.66
  - requests>=2.31

  # Pip-only packages
  - pip
  - pip:
    # LLM APIs (Step 3 — only the provider you run is required)
    - anthropic>=0.18.0
    - openai>=1.12.0
    - google-generativeai>=0.3.0

    # NLP / text features (Step 2)
    - vaderSentiment>=3.3.2
    - transformers>=4.36.0
    - torch>=2.1.0
    - detoxify>=0.5.0

    # Visualization
    - adjustText>=0.8
